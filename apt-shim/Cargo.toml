[package]
name = "neotales-ospm-apt-shim"
description = "C ABI for selected libapt-pkg operations"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "LGPL-2.1-or-later"
authors = ["x0craft"]
repository = "https://github.com/neotales/rs-ospm"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
native = ["dep:apt-pkg-native"]

[target.'cfg(target_os = "linux")'.dependencies]
apt-pkg-native = { version = "0.3.3", optional = true }

[lints]
workspace = true
