# This crate is developed as a standalone workspace so it can be validated
# without editing the parent workspace member list. When it joins the parent
# workspace, remove this section and the local workspace lints below.
[workspace]

[workspace.lints.rust]
missing_docs = "warn"

[package]
name = "neotales-ospm-bun-cli"
description = "Explicit process backend for Bun project and global packages"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "MIT"
authors = ["x0craft"]
repository = "https://github.com/neotales/rs-ospm"
readme = "README.md"
categories = ["os"]

[dependencies]
serde_json = "1.0"

[lints]
workspace = true
