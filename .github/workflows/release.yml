name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release
      - run: sudo apt-get update && sudo apt-get install -y libapt-pkg-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - name: Check tag and shared versions
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          versions = []
          for path in ("core/Cargo.toml", "apt/Cargo.toml", "apt-cli/Cargo.toml", "apt-shim/Cargo.toml", "pacman/Cargo.toml", "pacman-cli/Cargo.toml", "pacman-shim/Cargo.toml", "archive/Cargo.toml", "release/Cargo.toml", "github/Cargo.toml", "gitlab/Cargo.toml", "aqua/Cargo.toml", "go-tool/Cargo.toml"):
              with open(path, "rb") as f:
                  versions.append(tomllib.load(f)["package"]["version"])
          if len(set(versions)) != 1 or os.environ["TAG"] != "v" + versions[0]:
              raise SystemExit(f"tag and crate versions do not match: {versions}")
          PY

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-rust
        with:
          cache-key: release-publish
      - run: sudo apt-get update && sudo apt-get install -y libapt-pkg-dev
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish core, then APT crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          publish_crate() {
            local crate="$1" code output status
            code=$(curl -sS -o /dev/null -w '%{http_code}' \
              -H 'User-Agent: neotales-release (https://github.com/neotales)' \
              "https://crates.io/api/v1/crates/${crate}/${version}")
            if [ "$code" = 200 ]; then
              echo "$crate $version is already published"
              return 0
            fi
            if [ "$code" != 404 ]; then
              echo "registry lookup failed: HTTP $code"
              return 1
            fi
            for attempt in $(seq 1 15); do
              set +e
              output=$(cargo publish -p "$crate" --locked 2>&1)
              status=$?
              set -e
              printf '%s\n' "$output"
              if [ "$status" -eq 0 ] || printf '%s\n' "$output" | grep -Fq 'already uploaded'; then
                return 0
              fi
              if printf '%s\n' "$output" | grep -Fq 'failed to select a version for the requirement'; then
                sleep 20
              else
                return "$status"
              fi
            done
            return 1
          }
          publish_crate neotales-ospm-core
          publish_crate neotales-ospm-apt-shim
          publish_crate neotales-ospm-apt
          publish_crate neotales-ospm-apt-cli
          publish_crate neotales-ospm-pacman-shim
          publish_crate neotales-ospm-pacman
          publish_crate neotales-ospm-pacman-cli
          publish_crate neotales-ospm-archive
          publish_crate neotales-ospm-release
          publish_crate neotales-ospm-github
          publish_crate neotales-ospm-gitlab
          publish_crate neotales-ospm-aqua
          publish_crate neotales-ospm-go-cli
