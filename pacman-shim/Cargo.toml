[package]
name = "neotales-ospm-pacman-shim"
description = "C ABI shim for native libalpm access"
version = "0.0.0-alpha.0"
edition = "2024"
rust-version = "1.100"
license = "LGPL-2.1-or-later"
authors = ["x0craft"]
repository = "https://github.com/neotales/rs-ospm"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libloading = "0.8"
neotales-ospm-core = { path = "../core", version = "0.0.0-alpha.0" }

[lints]
workspace = true
